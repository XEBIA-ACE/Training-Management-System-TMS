# Local development dependencies for the Training Management Core Service.
# Usage: cp .env.example .env && docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TMS_DB_NAME:-tms}
      POSTGRES_USER: ${TMS_DB_USERNAME:-tms}
      POSTGRES_PASSWORD: ${TMS_DB_PASSWORD:?Set TMS_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
