# Training Management Core Service - base configuration.
# All environment-specific values (URLs, credentials, issuers) come from environment variables.
# No secrets or environment endpoints are hardcoded here.
spring:
  application:
    name: tms-core-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${TMS_DB_URL}
    username: ${TMS_DB_USERNAME}
    password: ${TMS_DB_PASSWORD}
    hikari:
      pool-name: tms-core-pool
      schema: ${TMS_DB_SCHEMA:tms}
      maximum-pool-size: ${TMS_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${TMS_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${TMS_DB_CONNECTION_TIMEOUT_MS:30000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${TMS_DB_SCHEMA:tms}
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: ${TMS_DB_SCHEMA:tms}
    default-schema: ${TMS_DB_SCHEMA:tms}
    create-schemas: true
    locations: classpath:db/migration

  data:
    redis:
      # Required. Full Redis URL, e.g. rediss://user:password@host:6379 (credentials via environment only).
      url: ${TMS_REDIS_URL}

  cache:
    type: ${TMS_CACHE_TYPE:redis}
    redis:
      time-to-live: ${TMS_CACHE_DEFAULT_TTL:PT5M}

tms:
  security:
    jwt:
      # OAuth2 Resource Server (bearer JWT). Provide the issuer (OIDC discovery, validated as `iss`)
      # and/or an explicit JWK set URI. Startup fails if neither is set while `required` is true.
      issuer-uri: ${TMS_JWT_ISSUER_URI:}
      jwk-set-uri: ${TMS_JWT_JWK_SET_URI:}
      audiences: ${TMS_JWT_AUDIENCES:}
      required: ${TMS_JWT_REQUIRED:true}
      role-claims: ${TMS_JWT_ROLE_CLAIMS:roles,groups,app_roles}
      tenant-claim: ${TMS_JWT_TENANT_CLAIM:tid}
    # Legacy username/password endpoints (/api/auth/login, /api/auth/refresh) for non-SSO
    # environments only. Disabled by default; OIDC bearer JWT is the primary path.
    legacy-auth:
      enabled: ${TMS_LEGACY_AUTH_ENABLED:false}
    openapi-public: ${TMS_OPENAPI_PUBLIC:false}

springdoc:
  api-docs:
    enabled: ${TMS_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${TMS_OPENAPI_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: SUPER_ADMIN,OPS_MONITOR
  health:
    redis:
      enabled: ${TMS_REDIS_HEALTH_ENABLED:true}

server:
  port: ${TMS_SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

logging:
  structured:
    format:
      console: ${TMS_LOG_FORMAT:ecs}
  level:
    root: ${TMS_LOG_LEVEL_ROOT:INFO}
    com.tms: ${TMS_LOG_LEVEL_APP:INFO}
