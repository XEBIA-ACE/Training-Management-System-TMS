# Local development profile. Activate with SPRING_PROFILES_ACTIVE=local.
# Defaults point at the services started by ../docker-compose.yml; the DB password is still
# supplied via TMS_DB_PASSWORD (see .env.example).
spring:
  datasource:
    url: ${TMS_DB_URL:jdbc:postgresql://localhost:5432/tms}
    username: ${TMS_DB_USERNAME:tms}
  data:
    redis:
      url: ${TMS_REDIS_URL:redis://localhost:6379}
  cache:
    type: ${TMS_CACHE_TYPE:simple}

tms:
  security:
    jwt:
      # Allow starting locally without an IdP; all bearer tokens are rejected until one is configured.
      required: ${TMS_JWT_REQUIRED:false}
    legacy-auth:
      enabled: ${TMS_LEGACY_AUTH_ENABLED:true}
    openapi-public: ${TMS_OPENAPI_PUBLIC:true}

springdoc:
  api-docs:
    enabled: ${TMS_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${TMS_OPENAPI_ENABLED:true}

management:
  health:
    redis:
      enabled: ${TMS_REDIS_HEALTH_ENABLED:false}

logging:
  structured:
    format:
      console: ${TMS_LOG_FORMAT:}
